
name: Import BidRadar production source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract project files
        env:
          ARCHIVE: "saudi-bidpilot-production%20(2).zip"
        run: |
          python3 - <<'PY'
          import os, stat, shutil
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path(os.environ['ARCHIVE'])
          if not archive.is_file():
              raise FileNotFoundError(f'Missing ZIP: {archive}')
          count = 0
          with ZipFile(archive) as z:
              if sum(i.file_size for i in z.infolist()) > 80_000_000:
                  raise ValueError('Archive too large')
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  parts = PurePosixPath(item.filename).parts
                  if len(parts) < 2 or parts[0] != 'saudi-bidpilot' or '..' in parts:
                      raise ValueError(f'Unsafe path: {item.filename}')
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise ValueError('Symlink not allowed')
                  relative = Path(*parts[1:])
                  if relative.parts[:2] == ('.github', 'workflows'):
                      continue
                  if relative.name == '.env':
                      raise ValueError('Private environment file')
                  target = Path.cwd() / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(item) as source, target.open('wb') as output:
                      shutil.copyfileobj(source, output)
                  count += 1
          for required in ['app/server.py', 'public/index.html',
                           'data/seed.json', 'tests/test_app.py', 'README.md']:
              if not Path(required).is_file():
                  raise ValueError(f'Missing project file: {required}')
          print(f'Extracted {count} project files')
          PY

      - name: Verify source and tests
        run: |
          python3 -m compileall -q app scripts tests
          python3 -m unittest discover -s tests -p 'test*.py' -q
          node --check public/app.js

      - name: Commit extracted project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import BidRadar v2.1 project source'
            git push origin HEAD:main
          fi
